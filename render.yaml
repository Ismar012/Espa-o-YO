# Implantação via Render > New > Blueprint (opcional)
services:
  - type: web
    runtime: static
    name: espaco-yo-demonstracao
    buildCommand: 'echo "Site estatico: nenhuma compilacao necessaria"'
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
