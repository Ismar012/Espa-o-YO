# Caso se use Render Blueprint no futuro: repositório com arquivos na raiz
services:
  - type: web
    runtime: static
    name: espaco-yo-demonstracao
    buildCommand: 'echo "Site pronto"'
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
